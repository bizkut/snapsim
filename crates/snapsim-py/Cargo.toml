[package]
name = "snapsim-py"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SnapSim Python module (snapsim_py)"

[lib]
name = "snapsim_py"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
snapsim = { path = "../snapsim" }
# The stable ABI keeps one build loadable by any Python 3.9+, whichever python3
# happens to be on PATH while building (Snapper-Assist runs 3.12).
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
numpy = "0.23"
rayon = "1"


[build-dependencies]
pyo3-build-config = "0.23"