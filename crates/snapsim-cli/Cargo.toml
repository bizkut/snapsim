[package]
name = "snapsim-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SnapSim command line: MARVEL SNAP simulation, advice, deck building and comparison"

[[bin]]
name = "snapsim"
path = "src/main.rs"

[dependencies]
snapsim = { path = "../snapsim" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
